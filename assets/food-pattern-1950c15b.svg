<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <g fill="none" stroke="black" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    <!-- PANCAKE STACK at (90, 90) -->
    <g transform="translate(90, 90)">
      <!-- Bottom pancake (full oval) -->
      <path d="M-40,18 Q-38,28 0,28 Q38,28 40,18 Q38,8 0,8 Q-38,8 -40,18Z"/>
      <!-- Middle pancake edge -->
      <path d="M-35,8 Q-34,-4 0,-4 Q34,-4 35,8"/>
      <!-- Top pancake edge -->
      <path d="M-28,-4 Q-27,-16 0,-16 Q27,-16 28,-4"/>
      <!-- Syrup drip -->
      <path d="M20,-16 Q24,-7 22,6 Q21,15 23,22"/>
      <!-- Butter pat -->
      <path d="M-8,-14 Q-4,-18 4,-14 Q8,-10 4,-8 Q-4,-8 -8,-12 Q-10,-14 -8,-14Z"/>
    </g>

    <!-- COFFEE CUP at (310, 65) -->
    <g transform="translate(310, 65)">
      <!-- Cup body -->
      <path d="M-23,8 L-18,40 L18,40 L23,8 Z"/>
      <!-- Lid -->
      <path d="M-25,8 Q0,2 25,8"/>
      <!-- Handle -->
      <path d="M18,16 Q34,16 34,25 Q34,34 18,34"/>
      <!-- Steam squiggles -->
      <path d="M-8,-4 Q-12,-12 -8,-20 Q-4,-26 -8,-32"/>
      <path d="M4,-4 Q0,-14 4,-22 Q8,-28 4,-34"/>
      <path d="M16,-4 Q12,-12 16,-20 Q20,-26 16,-32"/>
    </g>

    <!-- CROISSANT at (500, 105) -->
    <g transform="translate(500, 105)">
      <!-- Main body -->
      <path d="M-42,14 Q-30,-28 0,-23 Q28,-18 42,7 Q34,32 12,29 Q-14,27 -42,14Z"/>
      <!-- Inner layer curve -->
      <path d="M-33,11 Q-22,-21 0,-16 Q22,-11 32,5"/>
      <!-- Horn tips -->
      <path d="M-42,14 Q-52,-1 -46,-16"/>
      <path d="M42,7 Q52,-6 46,-18"/>
    </g>

    <!-- FRIED EGG at (110, 305) -->
    <g transform="translate(110, 305)">
      <!-- Egg white (organic blob) -->
      <path d="M-36,7 Q-34,-22 -17,-28 Q0,-34 17,-23 Q33,-12 37,7 Q39,27 23,35 Q8,43 -12,39 Q-33,34 -36,18 Z"/>
      <!-- Yolk -->
      <circle cx="2" cy="3" r="17" fill="black" fill-opacity="0.12"/>
      <circle cx="2" cy="3" r="17"/>
    </g>

    <!-- AVOCADO at (490, 290) -->
    <g transform="translate(490, 290)">
      <!-- Outer pear shape -->
      <path d="M0,-45 Q-28,-30 -28,6 Q-28,38 0,52 Q28,38 28,6 Q28,-30 0,-45Z"/>
      <!-- Inner flesh ring -->
      <ellipse cx="0" cy="16" rx="15" ry="20" fill="black" fill-opacity="0.08"/>
      <ellipse cx="0" cy="16" rx="15" ry="20"/>
      <!-- Pit center -->
      <ellipse cx="0" cy="16" rx="7" ry="9" fill="black" fill-opacity="0.25"/>
    </g>

    <!-- CHURROS at (300, 390) — two parallel ridged sticks -->
    <g transform="translate(300, 390)">
      <!-- Churro 1 -->
      <g transform="rotate(28)">
        <path d="M-52,-9 Q-61,-9 -61,0 Q-61,9 -52,9 L52,9 Q61,9 61,0 Q61,-9 52,-9 Z"/>
        <line x1="-38" y1="-9" x2="-38" y2="9"/>
        <line x1="-22" y1="-9" x2="-22" y2="9"/>
        <line x1="-6"  y1="-9" x2="-6"  y2="9"/>
        <line x1="10"  y1="-9" x2="10"  y2="9"/>
        <line x1="26"  y1="-9" x2="26"  y2="9"/>
        <line x1="42"  y1="-9" x2="42"  y2="9"/>
      </g>
      <!-- Churro 2 (offset below) -->
      <g transform="rotate(28) translate(0,22)">
        <path d="M-48,-9 Q-57,-9 -57,0 Q-57,9 -48,9 L48,9 Q57,9 57,0 Q57,-9 48,-9 Z"/>
        <line x1="-34" y1="-9" x2="-34" y2="9"/>
        <line x1="-18" y1="-9" x2="-18" y2="9"/>
        <line x1="-2"  y1="-9" x2="-2"  y2="9"/>
        <line x1="14"  y1="-9" x2="14"  y2="9"/>
        <line x1="30"  y1="-9" x2="30"  y2="9"/>
        <line x1="46"  y1="-9" x2="46"  y2="9"/>
      </g>
    </g>

    <!-- CREPE (quarter-folded fan) at (95, 500) -->
    <g transform="translate(95, 500) rotate(-15)">
      <!-- Fan shape: two straight edges + one curved arc -->
      <path d="M0,5 L-48,5 Q-50,-22 -32,-45 Q-16,-60 0,-55 Z"/>
      <!-- Center fold line -->
      <path d="M0,5 Q-20,-22 -32,-45"/>
      <!-- Filling texture lines -->
      <path d="M-10,-50 Q-5,-55 0,-52"/>
      <path d="M-22,-40 Q-12,-48 -4,-44"/>
      <path d="M-32,-25 Q-22,-35 -12,-30"/>
    </g>

    <!-- SMALL FRIED EGG at (480, 490) -->
    <g transform="translate(480, 490)">
      <path d="M-28,5 Q-26,-16 -12,-21 Q0,-26 12,-17 Q24,-9 28,5 Q30,18 18,26 Q6,33 -9,30 Q-25,25 -28,14 Z"/>
      <circle cx="1" cy="2" r="13" fill="black" fill-opacity="0.12"/>
      <circle cx="1" cy="2" r="13"/>
    </g>

    <!-- SMALL COFFEE at (165, 490) -->
    <g transform="translate(165, 490)">
      <path d="M-17,6 L-13,30 L13,30 L17,6 Z"/>
      <path d="M-18,6 Q0,1 18,6"/>
      <path d="M13,12 Q23,12 23,19 Q23,26 13,26"/>
      <path d="M-5,-2 Q-8,-10 -5,-17 Q-2,-23 -5,-28"/>
      <path d="M5,-2 Q2,-11 5,-18 Q8,-24 5,-29"/>
    </g>

    <!-- SMALL AVOCADO HALF at (430, 140) -->
    <g transform="translate(430, 140)">
      <path d="M0,-30 Q-20,-20 -20,4 Q-20,24 0,33 Q20,24 20,4 Q20,-20 0,-30Z"/>
      <ellipse cx="0" cy="10" rx="9" ry="12" fill="black" fill-opacity="0.2"/>
      <ellipse cx="0" cy="10" rx="9" ry="12"/>
    </g>

  </g>
</svg>
